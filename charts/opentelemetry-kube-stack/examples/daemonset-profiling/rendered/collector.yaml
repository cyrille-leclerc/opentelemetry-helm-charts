---
# Source: opentelemetry-kube-stack/templates/collector.yaml
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: example-profiler
  namespace: default
  labels:
    helm.sh/chart: opentelemetry-kube-stack-0.20.8
    app.kubernetes.io/version: "0.154.0"
    app.kubernetes.io/managed-by: Helm
    release: "example"        
spec:
  managementState: managed
  mode: daemonset
  config:
    exporters:
      debug: {}
      otlp_http:
        endpoint: http://example-otelcol-otlp-http.default.svc.cluster.local:4318
    processors:
      cumulativetodelta: {}
    receivers:
      profiling: {}
    service:
      pipelines:
        profiles:
          exporters:
          - otlp_http
          receivers:
          - profiling
  imagePullPolicy: IfNotPresent
  upgradeStrategy: automatic
  hostPID: true
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 250m
      memory: 64Mi
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    privileged: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: Unconfined
    seLinuxOptions:
      type: spc_t
    capabilities:
      drop: [ALL]
      add: ["BPF", "PERFMON", "SYS_PTRACE", "SYS_RESOURCE", "DAC_READ_SEARCH", "SYSLOG", "CHECKPOINT_RESTORE", "IPC_LOCK"]
  podAnnotations:
    container.apparmor.security.beta.kubernetes.io/otc-container: unconfined
  volumeMounts:
  - name: tracefs
    mountPath: /sys/kernel/tracing
    readOnly: true
  env:
  - name: K8S_NODE_NAME 
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: OTEL_K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: OTEL_K8S_NODE_IP
    valueFrom:
      fieldRef:
        fieldPath: status.hostIP
  - name: OTEL_K8S_NAMESPACE
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.namespace
  - name: OTEL_K8S_POD_NAME
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.name
  - name: OTEL_K8S_POD_IP
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: status.podIP
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "k8s.pod.name=$(OTEL_K8S_POD_NAME),k8s.namespace.name=$(OTEL_K8S_NAMESPACE),k8s.node.name=$(OTEL_K8S_NODE_NAME),host.name=$(OTEL_K8S_NODE_NAME),k8s.node.ip=$(OTEL_K8S_NODE_IP),k8s.pod.ip=$(OTEL_K8S_POD_IP),k8s.cluster.name=unknown_k8s_cluster"
  
  volumes:
  - name: tracefs
    hostPath:
      path: /sys/kernel/tracing
